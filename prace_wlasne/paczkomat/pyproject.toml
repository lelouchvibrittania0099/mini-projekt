[project]
name = "paczkomat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lelouch", email = "Hello, World!" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
paczkomat = "paczkomat:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["models", "services", "tests"]
